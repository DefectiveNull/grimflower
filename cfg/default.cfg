// Default controls, run every time the game starts. Packed into gamedata.zip, so don't edit the packed copy:
// change binds in the console with bind and save them with cfg_save, which writes config.cfg next to the game.
// config.cfg runs after this one, and autoexec.cfg after that, for your own commands and aliases.

unbindall

// Movement
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind space "+jump"
bind ctrl "+movedown"
bind x "fly"

// Tools
bind f1 "toggle r_showcolliders"
bind tab "togglecursor"
